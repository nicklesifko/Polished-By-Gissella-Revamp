<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Polished by Gissella</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg:     #FBF8F4;
            --dark:   #1A1512;
            --choc:   #3B2420;
            --accent: #6E4C40;
            --muted:  #7D665A;
            --gold:   #D4B4A0;
        }

        html, body {
            height: 100%;
        }

        body {
            background-color: var(--bg);
            color: var(--dark);
            font-family: 'Outfit', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            text-align: center;
            padding: 2rem;
        }

        /* Content */
        .content {
            position: relative;
            z-index: 1;
            max-width: 560px;
        }

        .eyebrow {
            display: block;
            font-size: 0.75rem;
            font-weight: 400;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 1.25rem;
        }

        .error-code {
            font-family: 'Playfair Display', serif;
            font-size: clamp(6rem, 18vw, 11rem);
            font-weight: 400;
            line-height: 1;
            letter-spacing: -0.03em;
            color: var(--choc);
            margin-bottom: 0.25rem;
        }

        .error-code em {
            font-style: italic;
            color: var(--accent);
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.4rem, 3vw, 2rem);
            font-weight: 400;
            margin-bottom: 1rem;
            letter-spacing: -0.01em;
        }

        p {
            font-size: 1rem;
            font-weight: 300;
            color: var(--muted);
            line-height: 1.75;
            margin-bottom: 2.5rem;
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 0.85rem 2rem;
            border-radius: 50px;
            font-family: 'Outfit', sans-serif;
            font-size: 0.9rem;
            font-weight: 400;
            letter-spacing: 0.08em;
            text-decoration: none;
            border: 2px solid var(--dark);
            transition: background 0.3s, color 0.3s, transform 0.3s;
            cursor: pointer;
        }

        .btn-primary {
            background: var(--dark);
            color: #fff;
        }

        .btn-primary:hover {
            background: var(--choc);
            border-color: var(--choc);
            transform: translateY(-2px);
        }

        .btn-outline {
            background: transparent;
            color: var(--dark);
        }

        .btn-outline:hover {
            background: var(--dark);
            color: #fff;
            transform: translateY(-2px);
        }

        /* Logo */
        .logo {
            position: fixed;
            top: 2rem;
            left: 5%;
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            color: var(--dark);
            text-decoration: none;
            z-index: 10;
        }

        /* Peekaboo photo */
        .photo {
            width: 170px;
            aspect-ratio: 3 / 4;
            margin: 0 auto 2rem;
            border-radius: 999px 999px 4px 4px;
            overflow: hidden;
            background: #F3EDE5;
        }

        .photo img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: 50% 30%;
        }

        @media (max-height: 760px) {
            .photo { display: none; }
        }

        /* Divider */
        .divider {
            width: 40px;
            height: 1px;
            background: var(--gold);
            margin: 0 auto 2rem;
        }
    </style>
</head>
<body>

    <a href="/" class="logo">Polished by Gissella</a>

    <div class="content">
        <!-- TEMP: Pixieset preview image. Swap for downloaded original in /images once available. -->
        <div class="photo">
            <img src="https://images.pixieset.com/021020821/56e93fa7cc274127cd63ca7a637e53af-large.jpg"
                 alt="Sarriah covering her mouth with both hands in surprise" width="640" height="960"
                 referrerpolicy="no-referrer">
        </div>
        <span class="eyebrow">Error 404</span>
        <div class="error-code">Oops<em>.</em></div>
        <div class="divider"></div>
        <h1>This page doesn't exist</h1>
        <p>Looks like this link is broken or the page was moved.<br>Let's get you back to somewhere beautiful.</p>
        <div class="btn-group">
            <a href="/" class="btn btn-primary">Back to Home</a>
            <a href="/#booking" class="btn btn-outline">Book an Appointment</a>
        </div>
    </div>

</body>
</html>
